name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run dependency-free tests
        run: PYTHONPATH=. python -m unittest discover -s ta_tasks/tests -v
      - name: Install release security scanners
        run: python -m pip install bandit==1.8.6 detect-secrets==1.5.0
      - name: Scan shipped Python code
        run: bandit -r ta_tasks -x ta_tasks/tests
      - name: Scan shipped files for secrets
        run: |
          detect-secrets scan --all-files --exclude-files '(^|/)tests/' ta_tasks > /tmp/ta-tasks-secrets.json
          python -c 'import json; result=json.load(open("/tmp/ta-tasks-secrets.json")); assert not result["results"], "Review detected secrets before release"'
      - name: Build plugin ZIP
        run: python scripts/build_plugin.py
      - name: Validate plugin ZIP and checksum
        run: python scripts/validate_package.py dist/ta_tasks-0.8.4.zip
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ta-tasks-workspace
          path: |
            dist/*.zip
            dist/*.sha256
